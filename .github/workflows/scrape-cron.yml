name: Scrape Tibia bazaar

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron is best-effort and can lag under
    # load, but is free and good enough for this use case.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/scrape
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tibia-bazaar.vercel.app/api/cron/scrape"
